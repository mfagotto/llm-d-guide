# Pin to RHCL 1.3.x for RHOAI 3.4 compatibility.
# RHCL 1.4.0 has a known Wasm shim regression affecting MaaS auth/rate-limit path.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Manual  # Manual approval required to prevent auto-upgrade
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhcl-operator.v1.3.6
