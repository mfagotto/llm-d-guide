# OLMv1 (OCP 4.21+) — use this instead of operator.yaml
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    openshift.io/display-name: Red Hat OpenShift Cluster Observability Operator
  labels:
    openshift.io/cluster-monitoring: "true"
  name: openshift-cluster-observability-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coo-installer
  namespace: openshift-cluster-observability-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coo-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: coo-installer
  namespace: openshift-cluster-observability-operator
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: cluster-observability-operator
spec:
  namespace: openshift-cluster-observability-operator
  serviceAccount:
    name: coo-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: cluster-observability-operator
      channels:
      - stable
  install:
    preflight:
      crdUpgradeSafety:
        disabled: false
