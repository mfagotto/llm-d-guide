# OLMv1 (OCP 4.21+) — DO NOT USE: NVIDIA GPU Operator bundle does not support
# AllNamespaces install mode. Always use install.sh (which applies operator.yaml via OLMv0).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    openshift.io/display-name: NVIDIA GPU Operator
  labels:
    openshift.io/cluster-monitoring: "true"
  name: nvidia-gpu-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-gpu-installer
  namespace: nvidia-gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-gpu-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: nvidia-gpu-installer
  namespace: nvidia-gpu-operator
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: gpu-operator-certified
spec:
  namespace: nvidia-gpu-operator
  serviceAccount:
    name: nvidia-gpu-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: gpu-operator-certified
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: Strict
