# OLMv1 (OCP 4.21+) — DO NOT USE: LeaderWorkerSet bundle does not support
# AllNamespaces install mode. Always use oc apply -k (which applies operator.yaml via OLMv0).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-lws-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lws-installer
  namespace: openshift-lws-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lws-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: lws-installer
  namespace: openshift-lws-operator
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: leader-worker-set
spec:
  namespace: openshift-lws-operator
  serviceAccount:
    name: lws-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: leader-worker-set
      channels:
      - stable-v1.0
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: Strict
